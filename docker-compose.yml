version: '3.8'

services:
  doc-assistant:
    build: .
    container_name: doc-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env  # Сюда мы положим ключ, чтобы не писать его в командной строке
    volumes:
      - ./models:/app/models  # Подключаем модель с компьютера
    restart: unless-stopped   # Автоматический перезапуск, если упадет